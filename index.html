<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Purple Wave Field</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000;
                 font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #container { width: 100%; height: 100%; touch-action: none; }

    /* ── Hint toast ──────────────────────────────────────────────────── */
    #hint {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
      padding: 9px 18px; border-radius: 20px; z-index: 90;
      background: rgba(10,0,25,.6); backdrop-filter: blur(8px);
      border: 1px solid rgba(168,85,247,.25);
      color: #b9a8e8; font-size: 12.5px; letter-spacing: .03em;
      pointer-events: none; white-space: nowrap;
      animation: hintFade 7s ease forwards;
    }
    @keyframes hintFade {
      0% { opacity: 0; } 8% { opacity: 1; } 80% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }

    /* ── Panel shell ─────────────────────────────────────────────────── */
    #panel {
      position: fixed; right: 0; top: 0; height: 100%;
      width: 300px; z-index: 100;
      transform: translateX(100%);
      transition: transform .35s cubic-bezier(.4,0,.2,1);
    }
    #panel.open { transform: translateX(0); }

    #panel-toggle {
      position: absolute; left: -48px; top: 16px;
      width: 40px; height: 40px; border-radius: 10px;
      background: rgba(10,0,25,.75); backdrop-filter: blur(8px);
      border: 1px solid rgba(168,85,247,.35);
      color: #c4b5fd; font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s, border-color .2s, transform .35s cubic-bezier(.4,0,.2,1);
    }
    #panel-toggle:hover { background: rgba(168,85,247,.2); border-color: rgba(168,85,247,.6); }
    #panel.open #panel-toggle { transform: rotate(60deg); }

    .panel-body {
      height: 100%; overflow-y: auto; padding: 18px 16px 30px;
      background: rgba(8,0,20,.88); backdrop-filter: blur(14px);
      border-left: 1px solid rgba(168,85,247,.25);
      scrollbar-width: thin; scrollbar-color: rgba(168,85,247,.3) transparent;
    }

    .panel-head {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 14px;
    }
    .panel-head h2 {
      font-size: 13px; font-weight: 600; letter-spacing: .08em;
      text-transform: uppercase; color: #a78bfa;
    }
    #status {
      font-size: 11px; color: #6d5f96; font-variant-numeric: tabular-nums;
    }

    /* ── Preset dropdown ─────────────────────────────────────────────── */
    .preset-row { margin-bottom: 14px; }
    .preset-row label { display: block; font-size: 11px; color: #8b7faa; margin-bottom: 5px;
                        text-transform: uppercase; letter-spacing: .06em; }
    .preset-row select {
      width: 100%; padding: 7px 10px; border-radius: 6px;
      background: rgba(255,255,255,.05); color: #d4c0ff;
      border: 1px solid rgba(168,85,247,.3); font-size: 13px;
      outline: none; cursor: pointer; transition: border-color .2s;
    }
    .preset-row select:hover { border-color: rgba(168,85,247,.6); }
    .preset-row select option { background: #1a0830; color: #d4c0ff; }

    /* ── Buttons row ─────────────────────────────────────────────────── */
    .btn-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .btn-row button {
      flex: 1; padding: 7px 0; border-radius: 6px; cursor: pointer;
      background: rgba(168,85,247,.12); color: #c4b5fd;
      border: 1px solid rgba(168,85,247,.3); font-size: 12px; font-weight: 500;
      transition: background .2s, border-color .2s;
    }
    .btn-row button:hover { background: rgba(168,85,247,.28); border-color: rgba(168,85,247,.6); }

    /* ── Color pickers ───────────────────────────────────────────────── */
    .color-row {
      display: flex; gap: 8px; margin-bottom: 14px;
    }
    .color-item {
      flex: 1; display: flex; align-items: center; gap: 7px;
      padding: 7px 9px; border-radius: 6px;
      background: rgba(255,255,255,.025); border: 1px solid rgba(168,85,247,.1);
    }
    .color-item label { font-size: 11px; color: #8b7faa; }
    .color-item input[type="color"] {
      -webkit-appearance: none; appearance: none;
      width: 26px; height: 26px; border: none; border-radius: 6px;
      background: none; cursor: pointer; padding: 0;
    }
    .color-item input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .color-item input[type="color"]::-webkit-color-swatch {
      border: 1px solid rgba(255,255,255,.2); border-radius: 6px;
    }
    .color-item input[type="color"]::-moz-color-swatch {
      border: 1px solid rgba(255,255,255,.2); border-radius: 6px;
    }

    /* ── Control group ───────────────────────────────────────────────── */
    .ctrl {
      margin-bottom: 11px; padding: 11px 12px; border-radius: 8px;
      background: rgba(255,255,255,.025);
      border: 1px solid rgba(168,85,247,.1);
      transition: opacity .25s;
    }
    .ctrl.off .sliders { opacity: .25; pointer-events: none; }

    .toggle-row { display: flex; align-items: center; justify-content: space-between; }
    .toggle-row span { font-size: 13px; font-weight: 500; color: #ddd6fe; }

    /* Custom switch */
    .sw { position: relative; display: inline-block; width: 36px; height: 20px; flex-shrink: 0; }
    .sw input { display: none; }
    .sw .track {
      position: absolute; inset: 0; border-radius: 10px; cursor: pointer;
      background: rgba(255,255,255,.1); transition: background .25s, box-shadow .25s;
    }
    .sw input:checked + .track {
      background: #a855f7; box-shadow: 0 0 10px rgba(168,85,247,.45);
    }
    .sw .track::after {
      content: ''; position: absolute;
      width: 16px; height: 16px; left: 2px; top: 2px;
      border-radius: 50%; background: #fff;
      transition: transform .25s cubic-bezier(.4,0,.2,1);
    }
    .sw input:checked + .track::after { transform: translateX(16px); }

    /* ── Slider rows ─────────────────────────────────────────────────── */
    .sliders { margin-top: 9px; }
    .slider-row { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
    .slider-row label { font-size: 11px; color: #8b7faa; min-width: 62px; }
    .slider-row input[type="range"] {
      -webkit-appearance: none; appearance: none;
      flex: 1; height: 4px; border-radius: 2px;
      background: rgba(255,255,255,.08); outline: none;
    }
    .slider-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 14px; height: 14px; border-radius: 50%;
      background: #a855f7; cursor: pointer;
      box-shadow: 0 0 6px rgba(168,85,247,.5);
    }
    .slider-row input[type="range"]::-moz-range-thumb {
      width: 14px; height: 14px; border-radius: 50%; border: none;
      background: #a855f7; cursor: pointer;
      box-shadow: 0 0 6px rgba(168,85,247,.5);
    }
    .slider-row .val {
      font-size: 11px; color: #a78bfa; min-width: 34px; text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .divider {
      height: 1px; margin: 13px 0;
      background: linear-gradient(90deg, transparent, rgba(168,85,247,.25), transparent);
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="hint">Click the waves for ripples &nbsp;·&nbsp; drag to attract &nbsp;·&nbsp; press H for controls</div>

  <!-- ═══ Effects Panel ═══════════════════════════════════════════════════ -->
  <div id="panel">
    <button id="panel-toggle" title="Toggle effects panel (H)">&#9881;</button>
    <div class="panel-body">
      <div class="panel-head">
        <h2>Effects</h2>
        <span id="status">— fps</span>
      </div>

      <!-- Preset -->
      <div class="preset-row">
        <label>Preset</label>
        <select id="preset">
          <option value="silk-flow">Silk Flow</option>
          <option value="calm-ocean">Calm Ocean</option>
          <option value="electric-storm">Electric Storm</option>
          <option value="deep-space">Deep Space</option>
          <option value="aurora-borealis">Aurora Borealis</option>
          <option value="neon-grid">Neon Grid</option>
          <option value="zen-garden">Zen Garden</option>
          <option value="supernova">Supernova</option>
        </select>
      </div>

      <div class="btn-row">
        <button id="btn-random" title="Randomize all settings">🎲 Randomize</button>
        <button id="btn-reset" title="Restore defaults">↺ Reset</button>
      </div>

      <div class="color-row">
        <div class="color-item">
          <input type="color" data-color="colorCore" value="#a855f7">
          <label>Core</label>
        </div>
        <div class="color-item">
          <input type="color" data-color="colorCrest" value="#c4b5fd">
          <label>Crest</label>
        </div>
      </div>

      <div class="divider"></div>

      <!-- Bloom -->
      <div class="ctrl">
        <div class="toggle-row">
          <span>Bloom Glow</span>
          <label class="sw"><input type="checkbox" data-toggle="bloom" checked><span class="track"></span></label>
        </div>
        <div class="sliders">
          <div class="slider-row">
            <label>Strength</label>
            <input type="range" data-slider="bloomStrength" min="0" max="3" step="0.1" value="0.8">
            <span class="val">0.8</span>
          </div>
        </div>
      </div>

      <!-- Depth of Field -->
      <div class="ctrl">
        <div class="toggle-row">
          <span>Depth of Field</span>
          <label class="sw"><input type="checkbox" data-toggle="dof" checked><span class="track"></span></label>
        </div>
        <div class="sliders">
          <div class="slider-row">
            <label>Focus</label>
            <input type="range" data-slider="focusDistance" min="10" max="120" step="1" value="50">
            <span class="val">50</span>
          </div>
          <div class="slider-row">
            <label>Blur</label>
            <input type="range" data-slider="dofStrength" min="0" max="0.06" step="0.001" value="0.020">
            <span class="val">0.020</span>
          </div>
        </div>
      </div>

      <!-- Wave Motion -->
      <div class="ctrl">
        <div class="toggle-row">
          <span>Wave Motion</span>
          <label class="sw"><input type="checkbox" data-toggle="waves" checked><span class="track"></span></label>
        </div>
        <div class="sliders">
          <div class="slider-row">
            <label>Speed</label>
            <input type="range" data-slider="waveSpeed" min="0.01" max="0.5" step="0.01" value="0.15">
            <span class="val">0.15</span>
          </div>
          <div class="slider-row">
            <label>Amplitude</label>
            <input type="range" data-slider="waveAmplitude" min="0.5" max="8" step="0.1" value="3.0">
            <span class="val">3.0</span>
          </div>
        </div>
      </div>

      <!-- Mouse Magnet -->
      <div class="ctrl">
        <div class="toggle-row">
          <span>Mouse Magnet</span>
          <label class="sw"><input type="checkbox" data-toggle="mouse" checked><span class="track"></span></label>
        </div>
        <div class="sliders">
          <div class="slider-row">
            <label>Radius</label>
            <input type="range" data-slider="mouseRadius" min="5" max="50" step="1" value="20">
            <span class="val">20</span>
          </div>
          <div class="slider-row">
            <label>Pull</label>
            <input type="range" data-slider="mousePullMax" min="1" max="15" step="0.5" value="6.0">
            <span class="val">6.0</span>
          </div>
        </div>
      </div>

      <!-- Click Ripples -->
      <div class="ctrl">
        <div class="toggle-row">
          <span>Click Ripples</span>
          <label class="sw"><input type="checkbox" data-toggle="ripples" checked><span class="track"></span></label>
        </div>
        <div class="sliders">
          <div class="slider-row">
            <label>Strength</label>
            <input type="range" data-slider="rippleStrength" min="0.2" max="3" step="0.1" value="1.0">
            <span class="val">1.0</span>
          </div>
        </div>
      </div>

      <!-- Sparkle -->
      <div class="ctrl">
        <div class="toggle-row">
          <span>Sparkle</span>
          <label class="sw"><input type="checkbox" data-toggle="sparkle" checked><span class="track"></span></label>
        </div>
        <div class="sliders">
          <div class="slider-row">
            <label>Amount</label>
            <input type="range" data-slider="sparkleStrength" min="0.1" max="1.5" step="0.05" value="0.40">
            <span class="val">0.40</span>
          </div>
        </div>
      </div>

      <!-- Aurora -->
      <div class="ctrl">
        <div class="toggle-row">
          <span>Aurora Colors</span>
          <label class="sw"><input type="checkbox" data-toggle="aurora"><span class="track"></span></label>
        </div>
        <div class="sliders">
          <div class="slider-row">
            <label>Amount</label>
            <input type="range" data-slider="auroraStrength" min="0.1" max="1.5" step="0.05" value="0.50">
            <span class="val">0.50</span>
          </div>
        </div>
      </div>

      <!-- Color Pulse -->
      <div class="ctrl">
        <div class="toggle-row">
          <span>Color Pulse</span>
          <label class="sw"><input type="checkbox" data-toggle="colorPulse"><span class="track"></span></label>
        </div>
        <div class="sliders">
          <div class="slider-row">
            <label>Speed</label>
            <input type="range" data-slider="colorPulseSpeed" min="0.05" max="1.5" step="0.05" value="0.30">
            <span class="val">0.30</span>
          </div>
        </div>
      </div>

      <!-- Vignette -->
      <div class="ctrl">
        <div class="toggle-row">
          <span>Vignette</span>
          <label class="sw"><input type="checkbox" data-toggle="vignette" checked><span class="track"></span></label>
        </div>
        <div class="sliders">
          <div class="slider-row">
            <label>Strength</label>
            <input type="range" data-slider="vignetteStrength" min="0.1" max="1" step="0.05" value="0.50">
            <span class="val">0.50</span>
          </div>
        </div>
      </div>

      <!-- Camera Drift -->
      <div class="ctrl">
        <div class="toggle-row">
          <span>Camera Drift</span>
          <label class="sw"><input type="checkbox" data-toggle="cameraDrift" checked><span class="track"></span></label>
        </div>
      </div>

      <!-- Auto Quality -->
      <div class="ctrl">
        <div class="toggle-row">
          <span>Auto Quality</span>
          <label class="sw"><input type="checkbox" data-toggle="autoQuality" checked><span class="track"></span></label>
        </div>
      </div>

      <div class="divider"></div>

      <!-- Exposure (global, no toggle) -->
      <div class="ctrl">
        <div class="sliders" style="margin-top:0">
          <div class="slider-row" style="margin-top:0">
            <label>Exposure</label>
            <input type="range" data-slider="exposure" min="0.4" max="2" step="0.05" value="1.00">
            <span class="val">1.00</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ Scripts ═════════════════════════════════════════════════════════ -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import createPurpleWaveField from './purple-wave.js';

    const { state } = createPurpleWaveField(document.getElementById('container'));

    // ── Presets ──────────────────────────────────────────────────────────────
    const DEFAULTS = {
      bloom: true, bloomStrength: 0.8,
      dof: true, focusDistance: 50, dofStrength: 0.020,
      waves: true, waveSpeed: 0.15, waveAmplitude: 3.0,
      mouse: true, mouseRadius: 20, mousePullMax: 6.0,
      ripples: true, rippleStrength: 1.0,
      sparkle: true, sparkleStrength: 0.4,
      aurora: false, auroraStrength: 0.5,
      cameraDrift: true,
      colorPulse: false, colorPulseSpeed: 0.3,
      vignette: true, vignetteStrength: 0.5,
      exposure: 1.0,
      autoQuality: true,
      colorCore: '#a855f7', colorCrest: '#c4b5fd',
    };

    const PRESETS = {
      'silk-flow': { ...DEFAULTS },
      'calm-ocean': { ...DEFAULTS,
        bloomStrength: 0.5, focusDistance: 35, dofStrength: 0.035,
        waveSpeed: 0.07, waveAmplitude: 2.0,
        mouseRadius: 30, mousePullMax: 3.0,
        rippleStrength: 0.6, sparkleStrength: 0.25,
        colorCore: '#6366f1', colorCrest: '#a5b4fc',
      },
      'electric-storm': { ...DEFAULTS,
        bloomStrength: 1.8, focusDistance: 45, dofStrength: 0.012,
        waveSpeed: 0.38, waveAmplitude: 5.5,
        mouseRadius: 12, mousePullMax: 12.0,
        rippleStrength: 2.2, sparkle: true, sparkleStrength: 1.0,
        exposure: 1.2,
      },
      'deep-space': { ...DEFAULTS,
        bloomStrength: 0.6, focusDistance: 65, dofStrength: 0.04,
        waveSpeed: 0.05, waveAmplitude: 1.5,
        mouseRadius: 25, mousePullMax: 4.0,
        sparkleStrength: 0.9, colorPulse: true, colorPulseSpeed: 0.15,
        vignetteStrength: 0.8,
        colorCore: '#7c3aed', colorCrest: '#e9d5ff',
      },
      'aurora-borealis': { ...DEFAULTS,
        bloomStrength: 1.1, focusDistance: 55, dofStrength: 0.028,
        waveSpeed: 0.10, waveAmplitude: 3.6,
        aurora: true, auroraStrength: 1.1,
        sparkleStrength: 0.55, vignetteStrength: 0.65,
        colorCore: '#0ea5e9', colorCrest: '#a7f3d0',
      },
      'neon-grid': { ...DEFAULTS,
        bloomStrength: 1.6, dof: false,
        waves: false, mouseRadius: 15, mousePullMax: 9.0,
        rippleStrength: 1.6,
        colorPulse: true, colorPulseSpeed: 0.5,
        cameraDrift: false, sparkle: false, vignette: false,
        colorCore: '#d946ef', colorCrest: '#f0abfc',
      },
      'zen-garden': { ...DEFAULTS,
        bloom: false, focusDistance: 55, dofStrength: 0.025,
        waveSpeed: 0.04, waveAmplitude: 1.2,
        mouse: false, ripples: true, rippleStrength: 0.5,
        sparkle: false, vignetteStrength: 0.4, exposure: 0.85,
      },
      'supernova': { ...DEFAULTS,
        bloomStrength: 2.5, focusDistance: 40, dofStrength: 0.01,
        waveSpeed: 0.42, waveAmplitude: 6.5,
        mouseRadius: 28, mousePullMax: 14.0,
        rippleStrength: 3.0, sparkleStrength: 1.3,
        colorPulse: true, colorPulseSpeed: 0.8,
        exposure: 1.4, vignette: false,
        colorCore: '#f59e0b', colorCrest: '#fef3c7',
      },
    };

    // ── Persistence ──────────────────────────────────────────────────────────
    const STORAGE_KEY = 'pwf-settings';
    let saveTimer = null;

    function saveSettings() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        const out = {};
        for (const k of Object.keys(DEFAULTS)) out[k] = state[k];
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(out)); } catch {}
      }, 250);
    }

    function loadSettings() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        for (const k of Object.keys(DEFAULTS)) {
          if (k in saved && typeof saved[k] === typeof DEFAULTS[k]) state[k] = saved[k];
        }
      } catch {}
    }

    // ── Panel toggle ────────────────────────────────────────────────────────
    const panel = document.getElementById('panel');
    document.getElementById('panel-toggle')
      .addEventListener('click', () => panel.classList.toggle('open'));
    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'h' && !e.metaKey && !e.ctrlKey && !e.altKey) {
        panel.classList.toggle('open');
      }
    });

    // ── UI helpers ───────────────────────────────────────────────────────────
    function formatVal(v) {
      const n = Number(v);
      if (n === 0) return '0';
      if (Math.abs(n) < 0.1) return n.toFixed(3);
      if (n % 1 === 0) return n.toFixed(0);
      return n.toFixed(n < 10 ? 2 : 1);
    }

    function syncUI() {
      document.querySelectorAll('[data-toggle]').forEach(el => {
        el.checked = state[el.dataset.toggle];
        el.closest('.ctrl').classList.toggle('off', !el.checked);
      });
      document.querySelectorAll('[data-slider]').forEach(el => {
        el.value = state[el.dataset.slider];
        el.nextElementSibling.textContent = formatVal(state[el.dataset.slider]);
      });
      document.querySelectorAll('[data-color]').forEach(el => {
        el.value = state[el.dataset.color];
      });
    }

    // ── Wire controls ────────────────────────────────────────────────────────
    document.querySelectorAll('[data-toggle]').forEach(el => {
      el.addEventListener('change', () => {
        state[el.dataset.toggle] = el.checked;
        el.closest('.ctrl').classList.toggle('off', !el.checked);
        saveSettings();
      });
    });

    document.querySelectorAll('[data-slider]').forEach(el => {
      el.addEventListener('input', () => {
        state[el.dataset.slider] = parseFloat(el.value);
        el.nextElementSibling.textContent = formatVal(el.value);
        saveSettings();
      });
    });

    document.querySelectorAll('[data-color]').forEach(el => {
      el.addEventListener('input', () => {
        state[el.dataset.color] = el.value;
        saveSettings();
      });
    });

    const presetSelect = document.getElementById('preset');
    presetSelect.addEventListener('change', () => {
      const p = PRESETS[presetSelect.value];
      if (!p) return;
      Object.assign(state, p);
      syncUI();
      saveSettings();
    });

    // ── Randomize & Reset ────────────────────────────────────────────────────
    const rnd  = (a, b) => a + Math.random() * (b - a);
    const coin = (p = 0.5) => Math.random() < p;

    function hslToHex(h, s, l) {
      const a = s * Math.min(l, 1 - l);
      const f = (n) => {
        const k = (n + h / 30) % 12;
        const c = l - a * Math.max(-1, Math.min(k - 3, Math.min(9 - k, 1)));
        return Math.round(255 * c).toString(16).padStart(2, '0');
      };
      return `#${f(0)}${f(8)}${f(4)}`;
    }

    document.getElementById('btn-random').addEventListener('click', () => {
      const hue = rnd(0, 360);
      Object.assign(state, {
        bloom: true,            bloomStrength: rnd(0.4, 2.2),
        dof: coin(0.8),         focusDistance: rnd(25, 90), dofStrength: rnd(0.008, 0.045),
        waves: true,            waveSpeed: rnd(0.04, 0.4),  waveAmplitude: rnd(1.2, 6.5),
        mouse: true,            mouseRadius: rnd(10, 40),   mousePullMax: rnd(3, 13),
        ripples: true,          rippleStrength: rnd(0.6, 2.5),
        sparkle: coin(0.7),     sparkleStrength: rnd(0.2, 1.2),
        aurora: coin(0.4),      auroraStrength: rnd(0.3, 1.3),
        cameraDrift: coin(0.8),
        colorPulse: coin(0.3),  colorPulseSpeed: rnd(0.1, 0.9),
        vignette: coin(0.8),    vignetteStrength: rnd(0.3, 0.9),
        exposure: rnd(0.7, 1.5),
        colorCore:  hslToHex(hue, 0.85, 0.55),
        colorCrest: hslToHex((hue + rnd(20, 70)) % 360, 0.8, 0.8),
      });
      syncUI();
      saveSettings();
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      Object.assign(state, DEFAULTS);
      presetSelect.value = 'silk-flow';
      try { localStorage.removeItem(STORAGE_KEY); } catch {}
      syncUI();
    });

    // ── Status line (FPS / render scale) ─────────────────────────────────────
    const statusEl = document.getElementById('status');
    setInterval(() => {
      if (!panel.classList.contains('open')) return;
      statusEl.textContent = `${state._fps || '—'} fps · ${state._dpr.toFixed(2)}x`;
    }, 500);

    // ── Init ─────────────────────────────────────────────────────────────────
    loadSettings();
    syncUI();
  </script>
</body>
</html>
